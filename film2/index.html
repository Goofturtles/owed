<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owed — launch film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="film.css">
</head>
<body>

<div class="stage" id="stage">
  <div class="ground g-white" data-l="white"></div>
  <div class="ground g-black" data-l="black"></div>
  <div class="ground g-blue"  data-l="blue"></div>
  <div class="glow" data-l="glow"></div>

  <!-- real photographs of real things -->
  <div class="photo" data-l="ph-head"><img src="../assets/img/photo/headphones.webp" alt=""></div>
  <div class="photo" data-l="ph-wash"><img src="../assets/img/photo/washing-machine.webp" alt=""></div>
  <div class="photo" data-l="ph-drill"><img src="../assets/img/photo/drill.webp" alt=""></div>
  <div class="photo" data-l="ph-laptop"><img src="../assets/img/photo/laptop.webp" alt=""></div>
  <div class="photo" data-l="ph-fixed"><img src="../assets/img/photo/headphones.webp" alt=""></div>

  <!-- the product, part by part; film.js fills this -->
  <div class="parts" id="parts"></div>

  <!-- the light that lands on things -->
  <div class="dot" data-l="dot"><i></i></div>

  <!-- type -->
  <div class="type" data-l="t-big"><h1 class="kinetic" id="big"></h1></div>
  <div class="cap-scrim" data-l="scrim"></div>
  <div class="cap" data-l="cap"><p id="cap"></p></div>

  <div class="stat-row" data-l="stats">
    <div><b data-n="300">0</b><span>rules read</span></div>
    <div><b data-n="190">0</b><span>brands</span></div>
    <div><b data-n="4">0</b><span>regions</span></div>
    <div><b class="lit">$0</b><span>to use</span></div>
  </div>

  <div class="lock" data-l="lock">
    <span class="mark"><svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path id="tickPath" d="M20 7 9.5 17.5 4 12"/></svg></span>
    <span class="word">Owed</span>
  </div>
  <div class="tick" data-l="tick"><svg viewBox="0 0 24 24" width="84" height="84" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7 9.5 17.5 4 12"/></svg></div>
  <div class="url" data-l="url"><span id="url"></span></div>
</div>

<div class="controls" id="controls">
  <button id="play" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="150" step="0.0333" value="0">
  <span id="clock">0.0</span>
  <audio id="track" src="track.mp3" preload="auto"></audio>
</div>

<script src="film.js"></script>
</body>
</html>
