reserve">Short answers. The full rule is one tap away in the app.</text></g></g><g id="faqList"><g id="faq-item-5"><rect x="115.00" y="395.19" width="1200.00" height="87.00" fill="url(#grad3)"/><g><g><text x="115.00" y="445.39" font-family="SF Pro Display, SF Pro Text, Inter, Helvetica Neue" font-size="20.00" font-weight="600" fill="#000000" letter-spacing="-0.20" xml:space="preserve">Is this actually free?</text></g><g id="svg-4"><svg x="1299.00" y="430.19" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"></path></svg></g></g></g><g id="faq-item-8"><rect x="115.00" y="482.19" width="1200.00" height="87.00" fill="url(#grad6)"/><g><g><text x="115.00" y="532.39" font-family="SF Pro Display, SF Pro Text, Inter, Helvetica Neue" font-size="20.00" font-weight="600" fill="#000000" letter-spacing="-0.20" xml:space="preserve">Do I need my receipt?</text></g><g id="svg-7"><svg x="1299.00" y="517.19" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"></path></svg></g></g></g><g id="faq-item-11"><rect x="115.00" y="569.19" width="1200.00" height="87.00" fill="url(#grad9)"/><g><g><text x="115.00" y="619.39" font-family="SF Pro Display, SF Pro Text, Inter, Helvetica Neue" font-size="20.00" font-weight="600" fill="#000000" letter-spacing="-0.20" xml:space="preserve">What if it finds nothing?</text></g><g id="svg-10"><svg x="1299.00" y="604.19" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"></path></svg></g></g></g><g id="faq-item-15"><rect x="115.00" y="656.19" width="1200.00" height="141.98" fill="url(#grad12)"/><g><g><text x="115.00" y="706.39" font-family="SF Pro Display, SF Pro Text, Inter, Helvetica Neue" font-size="20.00" font-weight="600" fill="#000000" letter-spacing="-0.20" xml:space="preserve">Is this legal advice?</text></g><g id="svg-13"><svg x="1299.00" y="691.19" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"></path></svg></g></g><g><g clip-path="url(#clip14)"><g><text x="115.00" y="760.31" font-family="SF Pro Display, SF Pro Text, Inter, Helvetica Neue" font-size="17.00" font-weight="400" fill="#666666" letter-spacing="-0.20" xml:space="preserve">No. Owed points at published rules and tells you what to ask. Every result links to its source.</text></g></g></g></g><g id="faq-item-18"><rect x="115.00" y="798.17" width="1200.00" height="87.00" fill="url(#grad16)"/><g><g><text x="115.00" y="848.37" font-family="SF Pro Display, SF Pro Text, Inter, Helvetica Neue" font-size="20.00" font-weight="600" fill="#000000" letter-spacing="-0.20" xml:space="preserve">Where does my data go?</text></g><g id="svg-17"><svg x="1299.00" y="833.17" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"></path></svg></g></g></g></g></g></g></svg>